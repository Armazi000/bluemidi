[package]
name = "bluemidi"
version = "0.1.0"
edition = "2024"
description = "Ultra low-latency Bluetooth Low Energy to MIDI bridge for Windows with MPE support"
license = "MIT"
readme = "README.md"
keywords = ["midi", "ble", "bluetooth", "mpe", "roli"]
categories = ["multimedia::audio", "os::windows-apis"]

[dependencies]
libloading = "0.9.0"
crossbeam-channel = "0.5.15"
pollster = "1.0.1"
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
